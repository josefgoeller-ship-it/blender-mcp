[project]
name = "blender-mcp"
version = "0.2.0"
description = "MCP server that creates and edits Blender .blend files, headless or in a live Blender session"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
blender-mcp = "blender_mcp.__main__:main"
blender-mcp-web = "blender_mcp.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/blender_mcp/web/templates" = "blender_mcp/web/templates"
"src/blender_mcp/web/static" = "blender_mcp/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: test requires a real Blender executable (deselect with '-m \"not blender\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately excludes the blind-except rules: catching Exception around user
# scripts and around Blender's main-thread dispatch is the whole design.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]
